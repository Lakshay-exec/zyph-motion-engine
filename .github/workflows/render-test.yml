name: Zyph Cloud Render & Verification Pipeline

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      render_short:
        description: "Render 9:16 Short (PokerFaceShort)"
        type: boolean
        default: true
      render_long:
        description: "Render 16:9 Long (PokerFaceLong)"
        type: boolean
        default: true
      render_thumb:
        description: "Render Thumbnail (PokerFaceThumb)"
        type: boolean
        default: true

jobs:
  cloud-render:
    name: Cloud Render MP4s & Thumbnail
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python 3.11 (Voiceover Engine)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libvips-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts requests python-dotenv pillow numpy

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Create Output Directory
        run: mkdir -p out

      - name: Render High-CTR Thumbnail (PokerFaceThumb)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.render_thumb }}
        run: |
          npx remotion still PokerFaceThumb out/poker-face-thumb.png

      - name: Render 9:16 Short (PokerFaceShort)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.render_short }}
        run: |
          npx remotion render PokerFaceShort out/poker-face-short.mp4 --concurrency=4

      - name: Render 16:9 Full Masterclass (PokerFaceLong)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.render_long }}
        run: |
          npx remotion render PokerFaceLong out/poker-face-long.mp4 --concurrency=4

      - name: Upload Rendered Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zyph-poker-face-renders
          path: out/
          retention-days: 14
